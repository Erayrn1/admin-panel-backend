<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Admin Panel</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="navbar-brand">
                <h1>Admin Panel</h1>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="nav-item">Anasayfa</a>
                <a href="settings.html" class="nav-item">Ayarlar</a>
                <button onclick="logout()" class="nav-item logout-btn">Çıkış Yap</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <div class="page-header">
                <h2>👤 Profil</h2>
                <p>Admin profil bilgilerinizi düzenleyin</p>
            </div>

            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-avatar">👤</div>
                    <div class="profile-info">
                        <h3>Erayrn</h3>
                        <p>Admin Kullanıcı</p>
                    </div>
                </div>

                <div class="profile-form">
                    <div class="form-section">
                        <h3>Temel Bilgiler</h3>
                        <div class="form-group">
                            <label>Kullanıcı Adı</label>
                            <input type="text" value="erayrn" disabled>
                        </div>
                        <div class="form-group">
                            <label>E-posta</label>
                            <input type="email" value="admin@karanlikhat.com" disabled>
                        </div>
                        <div class="form-group">
                            <label>Ad Soyad</label>
                            <input type="text" value="Karanlık Hat Admin" placeholder="Ad Soyad">
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>İletişim</h3>
                        <div class="form-group">
                            <label>Telefon</label>
                            <input type="tel" value="+90 (555) 123-4567" placeholder="Telefon numarası">
                        </div>
                        <div class="form-group">
                            <label>Konum</label>
                            <input type="text" value="İstanbul, Türkiye" placeholder="Şehir, Ülke">
                        </div>
                    </div>

                    <button class="save-btn">Değişiklikleri Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
