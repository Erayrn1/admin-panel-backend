<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenlik - Admin Panel</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="navbar-brand">
                <h1>Admin Panel</h1>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="nav-item">Anasayfa</a>
                <a href="settings.html" class="nav-item">Ayarlar</a>
                <button onclick="logout()" class="nav-item logout-btn">Çıkış Yap</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <div class="page-header">
                <h2>🔐 Güvenlik</h2>
                <p>Şifre ve güvenlik ayarlarını değiştirin</p>
            </div>

            <div class="security-container">
                <div class="security-section">
                    <h3>🔑 Şifre Değiştir</h3>
                    <form class="security-form">
                        <div class="form-group">
                            <label>Mevcut Şifre</label>
                            <input type="password" placeholder="Mevcut şifrenizi girin" required>
                        </div>
                        <div class="form-group">
                            <label>Yeni Şifre</label>
                            <input type="password" placeholder="Yeni şifreyi girin" required>
                        </div>
                        <div class="form-group">
                            <label>Yeni Şifre (Tekrar)</label>
                            <input type="password" placeholder="Yeni şifre tekrar" required>
                        </div>
                        <button type="submit" class="save-btn">Şifre Değiştir</button>
                    </form>
                </div>

                <div class="security-section">
                    <h3>🖥️ Aktif Oturumlar</h3>
                    <div class="session-item">
                        <div class="session-info">
                            <p class="session-device">Chrome - Windows</p>
                            <p class="session-location">İstanbul, Türkiye</p>
                            <p class="session-time">Şu anda aktif</p>
                        </div>
                        <button class="session-btn">Çıkış Yap</button>
                    </div>
                </div>

                <div class="security-section">
                    <h3>⚠️ Tehlikeli İşlemler</h3>
                    <div class="danger-section">
                        <h4>Hesabı Sil</h4>
                        <p>Bu işlem geri alınamaz. Tüm verileriniz silinecektir.</p>
                        <button class="danger-btn">Hesabı Sil</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
